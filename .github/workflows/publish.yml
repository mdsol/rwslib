name: Release
on:
  release:
    types:
      - created

jobs:
  publish:
    name: Publish to PyPI
    runs-on:
      self-hosted
    environment: pypi
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12" ]
        os: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 'latest'
      - name: Build Project
        run: uv build
      - name: Upload release to PyPI
        run: uv publish
