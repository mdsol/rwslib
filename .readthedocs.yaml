# .readthedocs.yaml
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      - pipx install uv
    post_install:
      - uv sync --with docs


# Build documentation using Sphinx
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true
