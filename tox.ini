[tox]
envlist = clean, py{310,311,312,313}, anaconda3, coverage, stats
recreate = true

[testenv]
allowlist_externals = uv
commands_pre =
    uv sync --group dev
commands =
    pytest tests --import-mode importlib
deps =
    pytest
    pytest-sugar
    mock
    httpretty


[testenv:coverage]
allowlist_externals = uv
commands_pre =
    uv sync --group dev
commands =
    coverage run -m pytest
deps =
    pytest
    pytest-sugar
    mock
    httpretty
    coverage

[testenv:clean]
allowlist_externals = uv, coverage
commands=
    coverage erase

[testenv:stats]
allowlist_externals = uv, coverage
commands=
    coverage report --include=rwslib/* --omit=*test*
    coverage html

[gh-actions]
python =
    3.10: py310, lint, manifest
    3.11: py311, lint, manifest
    3.12: py312, lint, manifest
    3.13: py313, lint, manifest
    pypy3: pypy3

[tool.coverage.run]
omit = [".*", "*/site-packages/*"]

[tool.coverage.report]
fail_under = 80

